<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTM Utility Map — MISO + PJM + NYISO (v0.7)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:13px/1.45 system-ui,sans-serif;color:#111}
  #map{position:absolute;inset:0}
  /* Mute OSM's default palette so utility polygons carry the color. Approximates CARTO Positron
     without an API key. Applies to tiles only; vector overlays sit in a different pane. */
  .leaflet-tile-pane{filter:grayscale(1) brightness(1.06) contrast(0.85);opacity:.85}
  .panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;
    padding:10px 12px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.3);width:230px}
  .panel h1{font-size:13px;margin:0 0 6px}
  .panel label{display:block;margin:2px 0;cursor:pointer}
  #status{font-size:11px;color:#555;margin-top:8px;white-space:pre-line}
  .legend{position:absolute;bottom:18px;right:10px;z-index:1000;background:#fff;
    padding:6px 10px 8px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.3);font-size:12px}
  .legend i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border:1px solid #999}
  /* collapsible boxes: a header row with a toggle, and a body that hides */
  .boxhd{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
    user-select:none;font-weight:600;font-size:12px}
  .boxhd .tgl{border:none;background:none;font-size:14px;line-height:1;padding:0 2px;color:#666;cursor:pointer}
  .collapsed .boxbody{display:none}
  .collapsed{padding-bottom:6px}
  .legend .boxhd{margin-bottom:4px}
  .lgtitle{font-weight:600;margin-bottom:4px;max-width:220px}
  @media (max-width:600px){
    .panel{width:min(230px,70vw);top:6px;right:6px}
    .legend{bottom:12px;right:6px;max-width:60vw}
    #drawer{width:100vw;max-width:100vw}
  }
  .coverage{font-size:11px;color:#666;margin:-2px 0 8px}
  .search{display:flex;gap:4px}
  .search input{flex:1;min-width:0;padding:5px 6px;font-size:12px;border:1px solid #ccc;border-radius:4px}
  .search button{padding:5px 10px}
  .grp{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .seg label{margin:0}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;padding:5px 4px;border:1px solid #ccc;border-radius:4px;
    font-size:12px;background:#fafafa;cursor:pointer;user-select:none}
  .seg input:checked+span{background:#1f4a7a;border-color:#1f4a7a;color:#fff}
  .seg input:focus-visible+span{outline:2px solid #7aa7d9;outline-offset:1px}
  .seg.small{grid-template-columns:repeat(3,1fr);margin-top:6px}
  .seg.small span{font-size:11px;padding:4px 2px}
  .progopts{margin-top:8px;padding:8px;border:1px solid #e6e6e6;border-radius:5px;background:#fbfbfb}
  .progopts[aria-disabled="true"]{opacity:.45;pointer-events:none}
  .progopts select{width:100%;padding:4px;font-size:12px;border:1px solid #ccc;border-radius:4px}
  .progopts.count-mode select{display:none}
  .progopts.count-mode .seg.small{margin-top:0}
  #status{font-size:10.5px;color:#888;margin-top:10px;white-space:pre-line}
  .devlink{display:block;font-size:10.5px;color:#999;margin-top:4px}
  hr.div{margin:8px 0;border:none;border-top:1px solid #ddd}
  #locInput{width:100%;box-sizing:border-box;margin:4px 0;padding:4px;
    font-size:12px;border:1px solid #ccc;border-radius:3px}
  button{padding:4px 6px;font-size:12px;cursor:pointer;border:1px solid #bbb;
    background:#f6f6f6;border-radius:3px}
  #locBtn{width:100%;margin-bottom:2px}
  #locResult{font-size:11px;color:#333;margin-top:4px;white-space:pre-line}

  /* detail drawer */
  #drawer{position:absolute;top:0;left:0;bottom:0;width:390px;max-width:88vw;z-index:1100;
    background:#fff;box-shadow:2px 0 10px rgba(0,0,0,.25);overflow-y:auto;
    transform:translateX(-100%);transition:transform .18s ease}
  #drawer.open{transform:none}
  #drawer .hd{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e3e3;
    padding:12px 14px 10px;z-index:2}
  #drawer .hd h2{margin:0 0 3px;font-size:15px;line-height:1.25}
  #drawer .sub{font-size:11px;color:#666}
  #closeDrawer{position:absolute;top:10px;right:10px;border:none;background:none;font-size:19px;color:#888}
  .bod{padding:10px 14px 28px}
  .sec{margin:0 0 14px}
  .sec>h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#555;
    margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid #eee}
  .chips span{display:inline-block;background:#eef2f7;border-radius:10px;padding:1px 8px;
    margin:0 4px 4px 0;font-size:11px}
  details.pg{border:1px solid #e5e5e5;border-radius:4px;margin-bottom:5px;background:#fcfcfc}
  details.pg>summary{cursor:pointer;padding:6px 8px;font-size:12px;list-style:none}
  details.pg>summary::-webkit-details-marker{display:none}
  details.pg[open]>summary{border-bottom:1px solid #eee;background:#f4f6f8}
  .cat{display:inline-block;font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:3px;
    background:#dbe6f2;color:#1f4a7a;margin-right:5px;vertical-align:1px}
  .cf{float:right;font-size:9.5px;padding:1px 5px;border-radius:3px;color:#fff;cursor:help}
  .cf.Primary{background:#2e7d32}.cf.Secondary{background:#ef6c00}.cf.Unverified{background:#757575}
  .provkey{font-size:10.5px;color:#666;margin:0 0 8px;line-height:1.7}
  .provkey .cf{float:none;cursor:default}
  .tierkey{font-size:11px;line-height:1.5}
  .tierkey b{display:inline-block;min-width:78px;padding:0 5px;border-radius:3px;color:#fff;font-weight:600;margin:0 6px 3px 0;text-align:center}
  .kv{padding:7px 9px;font-size:11.5px}
  .kv div{margin-bottom:3px}
  .kv b{color:#444;font-weight:600}
  .placeholder{font-size:11.5px;color:#8a8a8a;background:#fafafa;border:1px dashed #ddd;
    border-radius:4px;padding:8px 9px}
  .warn{font-size:11px;background:#fff8e1;border:1px solid #ffe082;border-radius:4px;
    padding:6px 8px;margin-bottom:10px;color:#6d4c00}
  a{color:#1462b3}
</style>
</head>
<body>
<div id="map"></div>

<div id="drawer">
  <div class="hd">
    <button id="closeDrawer" title="Close">&times;</button>
    <h2 id="dTitle">—</h2>
    <div class="sub" id="dSub">—</div>
  </div>
  <div class="bod" id="dBody"></div>
</div>

<div class="panel" id="panel">
  <div class="boxhd" data-toggle="panel"><h1 style="margin:0">Utility Program Map</h1><button class="tgl" aria-label="Collapse controls">▾</button></div>
  <div class="boxbody">
  <div class="coverage">Researched: MISO · PJM · NYISO</div>

  <div class="search">
    <input id="locInput" type="text" placeholder="Address, ZIP, or lat,lon">
    <button id="locBtn">Find</button>
  </div>
  <div id="locResult"></div>

  <div class="grp">Color by</div>
  <div class="seg" role="radiogroup" aria-label="Color by">
    <label><input type="radio" name="view" value="util" checked><span>Utility</span></label>
    <label><input type="radio" name="view" value="rto"><span>RTO / ISO</span></label>
    <label><input type="radio" name="view" value="count"><span>Program count</span></label>
    <label><input type="radio" name="view" value="type"><span>Program type</span></label>
  </div>

  <div id="progOpts" class="progopts" aria-disabled="true">
    <select id="typeSel" aria-label="Program type">
      <option value="tou">Time-of-use rates</option>
      <option value="dynamic">Real-time &amp; critical-peak pricing</option>
      <option value="thermostat">Smart thermostat</option>
      <option value="dlc">AC / water-heater control</option>
      <option value="battery">Battery &amp; VPP</option>
      <option value="ev">EV rates &amp; managed charging</option>
      <option value="curtail">Interruptible / curtailment</option>
      <option value="demand">Demand-charge rates</option>
      <option value="export">Solar export / net metering</option>
    </select>
    <div class="seg small" role="radiogroup" aria-label="Customer type">
      <label><input type="radio" name="seg" value="all" checked><span>All</span></label>
      <label><input type="radio" name="seg" value="res"><span>Residential</span></label>
      <label><input type="radio" name="seg" value="ci"><span>C&amp;I</span></label>
    </div>
  </div>

  <div id="status">Loading…</div>
  <a href="#" id="exportBtn" class="devlink">Export EIA-ID crosswalk (CSV)</a>
  </div>
</div>
<div class="legend" id="legendBox">
  <div class="boxhd" data-toggle="legendBox"><span>Legend</span><button class="tgl" aria-label="Collapse legend">▾</button></div>
  <div class="boxbody" id="legend"></div>
</div>

<script>
const SVC = "https://services3.arcgis.com/OYP7N6mAJJCyH6hd/arcgis/rest/services/Electric_Retail_Service_Territories_HIFLD/FeatureServer/0/query";
const STATES = ['MN','WI','IA','IL','IN','MI','MO','OH','PA','NJ','MD','DE',
                'VA','WV','KY','DC','AR','LA','MS','ND','SD',
                'NY'];   // TX deliberately excluded: ERCOT noise
const OUT_FIELDS = "ID,NAME,TYPE,STATE,CUSTOMERS,CNTRL_AREA,PLAN_AREA";
/* Footprint utilities whose HIFLD home-state is outside STATES. HIFLD STATE = HQ state. */
const EXTRA_IDS = ['17698',    // SWEPCO (AEP) — filed under OK, serves AR/LA/TX
                   '55937',    // Entergy Texas — the only MISO utility in TX; don't load all of ERCOT
                   '16213'];   // Rockland Electric (O&R's NJ sub, PJM) — HIFLD files it under NY

/* ---------------------------------------------------------------------------
   norm() is MIRRORED from scripts/build_map_payload.py. Keep the two in sync
   or the join silently degrades.
--------------------------------------------------------------------------- */
const SUFFIX = /\b(CO|COMPANY|INC|LLC|CORP|CORPORATION|LP|LTD|PLC)\b/g;
const PREFIX = /^(CITY OF|TOWN OF|VILLAGE OF|BOROUGH OF|COUNTY OF)\b/;
const WORDS = [[/\bELEC\b/g,'ELECTRIC'],[/\bCOOP\b/g,'COOPERATIVE'],[/\bCO-OP\b/g,'COOPERATIVE'],
  [/\bASSN\b/g,'ASSOCIATION'],[/\bPWR\b/g,'POWER'],[/\bUTIL\b/g,'UTILITIES'],
  [/\bDEPT\b/g,'DEPARTMENT'],[/\bMUN\b/g,'MUNICIPAL'],[/\bSVC\b/g,'SERVICE'],
  [/\bSERVICES\b/g,'SERVICE'],[/\bUTILITY\b/g,'UTILITIES'],[/\bLT\b/g,'LIGHT'],
  [/\bLGT\b/g,'LIGHT'],[/\bCOMM\b/g,'COMMISSION'],[/\bDIV\b/g,'DIVISION']];

function norm(s){
  s = (s||'').toUpperCase().split('&').join(' AND ');
  s = s.replace(/\bCO-OP/g,'COOPERATIVE').replace(/^THE\s+/,'');
  s = s.replace(/\([^)]*\)/g,' ').replace(/\s*-\s*\([A-Z]{2}\)\s*$/,' ')
       .replace(/\bD\/B\/A\b.*$/,' ').replace(/[^A-Z0-9 ]+/g,' ');
  for(const [p,r] of WORDS) s = s.replace(p,r);
  s = s.replace(PREFIX,' ').replace(SUFFIX,' ');
  return s.replace(/\s+/g,' ').trim();
}

/* ---- data ---- */
let DATA = {utilities:{}, market:[]};
let PRES = {};   // eia_id -> {rh,rd,ch,cd,u,rto,n}  (presence.json)
const PRES_VIEWS = {rh:'res_habit', rd:'res_dispatch', ch:'ci_habit', cd:'ci_dispatch'};
const PRES_COLORS = {Yes:'#2e8b57', No:'#c0392b', Unknown:'#d9d9d9', ViaAggregator:'#3a6fb0',
                     OutOfFootprint:'#8c8c8c', NotScanned:'#f2f2f2'};
const RESEARCHED_RTOS = new Set(['MISO','PJM','MISO/PJM','NYISO','Unknown']);
const IN_FOOTPRINT = rto => !rto || RESEARCHED_RTOS.has(rto);
function presenceOf(p){ return PRES[String(p.ID)] || null; }
function presenceState(p, cell){
  const pr = presenceOf(p);
  if(!pr) return 'NotScanned';            // <10k customers, outside the denominator
  if(!IN_FOOTPRINT(pr.rto)) return 'OutOfFootprint';
  return pr[cell] || 'Unknown';
}
let matchStats = {matched:0, total:0, unmatchedPayload:[]};

function progsFor(p){
  const u = DATA.utilities[norm(p.NAME)];
  return u ? u : null;
}

/* ---- styling ---- */
/* Researched markets get strong colors; markets we have not researched yet get muted ones so the
   map says WHAT a territory is instead of lumping it into gray. Codes are HIFLD CNTRL_AREA
   (balancing authority) values. */
const RTO_COLORS  = {MISO:'#1b9e77', PJM:'#3a6fb0', 'MISO/PJM':'#7570b3', NYISO:'#d95f02',
  'SPP (not yet researched)':'#c9b98f', 'TVA (non-RTO)':'#b39ddb', 'AECI (non-RTO)':'#e0c3a8',
  'LG&E/KU (non-RTO)':'#a8c6d9', 'ISO-NE (not yet researched)':'#e6a1a1',
  'WAPA / West (non-RTO)':'#c5d3a8', 'Southeast (non-RTO)':'#d6c6b8', OTHER:'#bdbdbd'};
const BA_MAP = [
  [/\bSWPP\b|SOUTHWEST POWER POOL/, 'SPP (not yet researched)'],
  [/\bTVA\b|TENNESSEE VALLEY/,         'TVA (non-RTO)'],
  [/\bAECI\b|ASSOCIATED ELECTRIC/,     'AECI (non-RTO)'],
  [/\bLGEE\b|LOUISVILLE GAS/,          'LG&E/KU (non-RTO)'],
  [/\bISNE\b|ISO NEW ENGLAND/,         'ISO-NE (not yet researched)'],
  [/\bWACM\b|\bWAUW\b|\bSPA\b|\bPSCO\b|WESTERN AREA/, 'WAPA / West (non-RTO)'],
  [/\bSOCO\b|\bDUK\b|\bCPLE\b|\bSC\b|\bSCEG\b|\bFPL\b/, 'Southeast (non-RTO)'],
];
const OWNER_COLORS = {'IOU':'#e6550d','Cooperative':'#31a354','Municipal':'#756bb1',
  'Federal/State':'#fec44f','Unknown':'#dddddd'};
const COUNT_COLORS = ['#eeeeee','#d7ecd9','#a1d99b','#41ab5d','#006d2c'];
function countColor(n){ return n===0?COUNT_COLORS[0]:n<3?COUNT_COLORS[1]:n<6?COUNT_COLORS[2]:n<10?COUNT_COLORS[3]:COUNT_COLORS[4]; }

/* RTO: prefer our verified value, fall back to the HIFLD control-area heuristic */
function rtoOf(p){
  const u = progsFor(p);
  if(u && u.rto && u.rto!=='Non-RTO') return u.rto;
  const s = ((p.CNTRL_AREA||'')+' '+(p.PLAN_AREA||'')).toUpperCase();
  if (s.includes('MIDCONTINENT') || /\bMISO\b/.test(s)) return 'MISO';
  if (s.includes('PJM')) return 'PJM';
  if (s.includes('NEW YORK') || /\bNYIS/.test(s)) return 'NYISO';
  for (const [re,label] of BA_MAP) if (re.test(s)) return label;
  return 'OTHER';
}
/* Ownership: prefer ours. HIFLD TYPE is frequently "NOT AVAILABLE". */
function ownerOf(p){
  const u = progsFor(p);
  if(u && u.own) return u.own;
  const t = (p.TYPE||'').toUpperCase().trim();
  if(t==='INVESTOR OWNED') return 'IOU';
  if(t==='COOPERATIVE') return 'Cooperative';
  if(t==='MUNICIPAL'||t==='POLITICAL SUBDIVISION') return 'Municipal';
  if(t==='STATE'||t==='FEDERAL') return 'Federal/State';
  return 'Unknown';
}

let currentView = 'util';
let currentType = 'tou';
let currentSeg = 'all';

/* Program-type buckets. Each maps to program_category values in programs.csv. `family` links a
   bucket to the coarser presence-scan cells (habit = price signal, dispatch = device control), so a
   utility we only presence-scanned can still show "has something in this family". */
const PROGRAM_TYPES = {
  tou:        {label:'Time-of-use rates',                   cats:['TOU-Rate'],                          family:'habit'},
  dynamic:    {label:'Real-time & critical-peak pricing',   cats:['RTP-Rate','CPP-PTR'],                family:'habit'},
  thermostat: {label:'Smart thermostat',                    cats:['DR-BYOT'],                           family:'dispatch'},
  dlc:        {label:'AC / water-heater control',           cats:['DR-DLC'],                            family:'dispatch'},
  battery:    {label:'Battery & VPP',                       cats:['VPP','DR-BYOD','Storage-Incentive'], family:'dispatch'},
  ev:         {label:'EV rates & managed charging',         cats:['EV-Rate'],                           family:'habit'},
  curtail:    {label:'Interruptible / curtailment',         cats:['DR-Curtailment'],                    family:'dispatch'},
  demand:     {label:'Demand-charge rates',                 cats:['Demand-Charge'],                     family:'habit'},
  export:     {label:'Solar export / net metering',         cats:['Export-Comp'],                       family:null},
};
const COUNTED_CATS = new Set(Object.values(PROGRAM_TYPES).flatMap(t=>t.cats));

function segOk(prog){
  if(currentSeg==='all') return true;
  const s = prog.seg || '';
  if(/\bAll\b/.test(s)) return true;
  return currentSeg==='res' ? /Residential/.test(s) : /C&I/.test(s);
}
function inResearched(p){ return RESEARCHED_RTOS.has(rtoOf(p)) && rtoOf(p)!=='Unknown'; }

/* Presence-scan fallback for utilities without itemized program rows. */
function presenceFamily(p, family){
  const pr = presenceOf(p); if(!pr || !family) return null;
  const cells = family==='habit' ? {res:pr.rh, ci:pr.ch} : {res:pr.rd, ci:pr.cd};
  const vals = currentSeg==='all' ? [cells.res, cells.ci] : [cells[currentSeg]];
  if(vals.includes('Yes')) return 'Yes';
  if(vals.every(v=>v==='No')) return 'No';
  return null;
}

const V = {  // one palette for both program views
  outside:'#d4d4d4', unknown:'#ececec', none:'#e9b9ad', related:'#cfe6d6',
  c1:'#a8d5b7', c2:'#5fb383', c3:'#2e8b57', c4:'#15603a',
};
const OUT_OPACITY = 0.18;

function typeState(p){
  if(!inResearched(p)) return 'outside';
  const t = PROGRAM_TYPES[currentType], u = progsFor(p);
  const n = u ? u.programs.filter(x=>t.cats.includes(x.cat) && segOk(x)).length : 0;
  if(n>=2) return 'c3';
  if(n===1) return 'c2';
  const fam = presenceFamily(p, t.family);
  if(fam==='Yes') return 'related';
  if(u) return 'none';            // researched in depth, nothing of this type
  if(fam==='No') return 'none';
  return 'unknown';
}
function countState(p){
  if(!inResearched(p)) return 'outside';
  const u = progsFor(p);
  if(u){
    const n = u.programs.filter(x=>COUNTED_CATS.has(x.cat) && segOk(x)).length;
    return n===0?'none': n<3?'c1': n<6?'c2': n<10?'c3':'c4';
  }
  const a = presenceFamily(p,'habit'), b = presenceFamily(p,'dispatch');
  if(a==='Yes'||b==='Yes') return 'related';
  if(a==='No'&&b==='No') return 'none';
  return 'unknown';
}

/* Utility view: a stable muted color per utility so neighbors read as distinct territories. */
const UTIL_PALETTE = ['#8fb3d9','#a6cfa0','#e3c28f','#c7a6d9','#93cfc9','#e0a7a7','#b7c48a','#d9b3cf','#9fb7c9','#d6c79e'];
function utilColor(p){
  const k = String(p.NAME||p.ID); let h = 0;
  for(let i=0;i<k.length;i++) h = (h*31 + k.charCodeAt(i)) >>> 0;
  return UTIL_PALETTE[h % UTIL_PALETTE.length];
}

function colorFor(p){
  if (currentView==='util')  return utilColor(p);
  if (currentView==='rto')   return RTO_COLORS[rtoOf(p)] || '#bdbdbd';
  if (currentView==='type')  return V[typeState(p)];
  if (currentView==='count') return V[countState(p)];
  return '#ccc';
}
function fillOpacityFor(p){
  if ((currentView==='type'||currentView==='count') && !inResearched(p)) return OUT_OPACITY;
  return 0.5;
}
const BORDER = '#333';
function styleFn(f){ return {color:BORDER,weight:0.7,fillColor:colorFor(f.properties),fillOpacity:fillOpacityFor(f.properties)}; }
function styleFnHL(f){ return {color:'#f00',weight:2.4,fillColor:colorFor(f.properties),fillOpacity:0.75}; }

/* ---- map ---- */
const map = L.map('map').setView([40.5,-85],5);
/* CARTO's free basemap endpoint started returning "API KEY REQUIRED" tiles (observed 2026-09-09).
   OSM standard tiles need no key; their usage policy is fine for a low-traffic internal tool.
   Swap to a keyed provider (Stadia/MapTiler) before any real volume. */
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'© OpenStreetMap contributors', maxZoom:19}).addTo(map);

let layer=null, marker=null, highlighted=null, allFeatures=[];
const statusEl=document.getElementById('status'), legendEl=document.getElementById('legend'),
      locResult=document.getElementById('locResult'), drawer=document.getElementById('drawer');

/* ---- detail drawer ---- */
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAT_ORDER = ['TOU-Rate','RTP-Rate','CPP-PTR','Demand-Charge','Storage-Incentive','VPP',
  'DR-BYOD','DR-BYOT','DR-DLC','DR-Curtailment','EV-Rate','Export-Comp','Interconnection','Wholesale-Market'];

function kvRow(label, val){ return val && val.trim() ? `<div><b>${label}:</b> ${esc(val)}</div>` : ''; }

/* Source tier badge — Primary / Secondary / Unverified. Derived in scripts/source_tier.py from
   the linked URL's domain plus the researcher's note; the raw confidence column is kept in the
   data but not shown. Definitions come from DATA.tierHelp so the build script owns the wording. */
const TIER_FALLBACK = {
  Primary:    'Linked page is the source itself (utility tariff/program page, regulator, RTO, statute).',
  Secondary:  'Linked page reports on the source (news, DSIRE, trade press, a G&T describing a member program).',
  Unverified: 'No usable link, or the link does not show the claim. Treat as a lead, not a fact.',
};
function tierHelp(t){ return (DATA.tierHelp && DATA.tierHelp[t]) || TIER_FALLBACK[t] || ''; }
function tierBadge(t){
  t = t || 'Unverified';
  return `<span class="cf ${esc(t)}" title="${esc(tierHelp(t))}">${esc(t)}</span>`;
}
function tierKeyHTML(){
  return `<div class="tierkey">
    <div><b style="background:#2e7d32">Primary</b>${esc(tierHelp('Primary'))}</div>
    <div><b style="background:#ef6c00">Secondary</b>${esc(tierHelp('Secondary'))}</div>
    <div><b style="background:#757575">Unverified</b>${esc(tierHelp('Unverified'))}</div></div>`;
}
function tierKey(){
  return `<div class="provkey">Badge = what the link actually is:
    <span class="cf Primary">Primary</span> the source itself &middot;
    <span class="cf Secondary">Secondary</span> reports on the source &middot;
    <span class="cf Unverified">Unverified</span> no usable link. Hover any badge.</div>`;
}

function programHTML(p){
  return `<details class="pg"><summary><span class="cat">${esc(p.cat)}</span>${esc(p.n)}
    ${tierBadge(p.tier)}</summary>
    <div class="kv">
      ${kvRow('Status', p.status)}${kvRow('Who', p.seg)}${kvRow('Assets', p.assets)}
      ${kvRow('Enrollment', p.enroll)}${kvRow('Structure', p.struct)}${kvRow('Value', p.val)}
      ${kvRow('Limits', p.limits)}${kvRow('Tariff', p.tariff)}${kvRow('Peak window', p.peak)}
      ${kvRow('Rates', p.rates)}${kvRow('Export', p.export)}${kvRow('Storage eligible', p.stor)}
      ${kvRow('Stacks with', p.stack)}
      <div style="margin-top:5px"><a href="${esc(p.url)}" target="_blank" rel="noopener">source ↗</a></div>
    </div></details>`;
}

/* ---- interconnection rendering ----
   State rules are the floor; utility rows carry only deltas. A utility with no delta row
   inherits the state rule, which is meaningful information, not missing data. */
const IC_HEADLINE = [
  ['nem_status','Export regime'], ['export_credit_basis','Credit basis'],
  ['export_credit_value','Credit value'], ['grid_charging_allowed','Grid charging'],
  ['non_export_option','Non-export path'], ['standby_charge','Standby charge'],
  ['standby_threshold_kw','Standby threshold (kW)'],
  ['nem_cap_res_kw','Residential cap (kW)'], ['nem_cap_nonres_kw','Non-res cap (kW)'],
  ['nem_aggregate_cap','Aggregate cap'], ['nem_sizing_rule','Sizing rule'],
];
const IC_REST = [
  ['jurisdiction_body','Regulator'], ['rule_citation','Citation'], ['applies_to','Applies to'],
  ['nem_successor','Successor regime'], ['credit_rollover','Rollover'], ['annual_true_up','True-up'],
  ['ic_standard','Inverter standard'], ['ic_fast_track_kw','Fast track (kW)'],
  ['ic_simplified_kw','Simplified (kW)'], ['ic_application_fee','Application fee'],
  ['ic_study_trigger_kw','Study trigger (kW)'], ['external_disconnect','External disconnect'],
  ['insurance_required','Insurance'], ['ic_timeline_days','Timeline (days)'],
  ['storage_allowed','Storage allowed'], ['storage_counts_toward_cap','Storage counts to cap'],
];

function icRows(obj, spec){
  return spec.map(([k,label])=>kvRow(label, obj[k])).join('');
}

function interconnectionHTML(p, u){
  const st = DATA.icStates && DATA.icStates[p.STATE];
  const deltas = (u && u.ic) || [];
  let h = `<div class="sec"><h3>Interconnection &amp; export rules</h3>`;

  if(!st && !deltas.length){
    h += `<div class="placeholder">No interconnection data on file for ${esc(p.STATE)}.</div></div>`;
    return h;
  }

  if(deltas.length){
    deltas.forEach(d=>{
      h += `<details class="pg" open><summary><span class="cat">UTILITY RULE</span>Deviates from state default
        ${tierBadge(d.tier)}</summary><div class="kv">
        ${kvRow('Deviates on', d.deviates_on)}${kvRow('Summary', d.rule_summary)}
        ${icRows(d, IC_HEADLINE)}${kvRow('Aggregate cap status', d.aggregate_cap_status)}
        ${kvRow('Application fee', d.ic_application_fee)}${kvRow('Study trigger (kW)', d.ic_study_trigger_kw)}
        ${kvRow('External disconnect', d.external_disconnect)}
        ${kvRow('Storage notes', d.storage_specific_notes)}
        ${d.source_url?`<div style="margin-top:5px"><a href="${esc(d.source_url)}" target="_blank" rel="noopener">source ↗</a></div>`:''}
        </div></details>`;
    });
  } else if(st){
    h += `<div class="warn" style="background:#eef7ee;border-color:#bcdcbc;color:#2c5c2c">
      No utility-specific deviations on file — state rules below apply as written.</div>`;
  }

  if(st){
    h += `<details class="pg" ${deltas.length?'':'open'}><summary><span class="cat">STATE RULE</span>${esc(p.STATE)} default
      ${tierBadge(st.tier)}</summary><div class="kv">
      ${icRows(st, IC_HEADLINE)}
      <div style="margin:6px 0 3px;font-weight:600;color:#666">Process</div>
      ${icRows(st, IC_REST)}
      <div style="margin-top:5px"><a href="${esc(st.source_url)}" target="_blank" rel="noopener">source ↗</a></div>
      </div></details>`;
  }
  return h + `</div>`;
}

function openDrawer(p){
  const u = progsFor(p);
  const fmt = n => (n==null?'—':Number(n).toLocaleString());
  document.getElementById('dTitle').textContent = p.NAME||'(unnamed)';
  document.getElementById('dSub').innerHTML =
    `EIA ID <code>${esc(p.ID)}</code> · ${esc(p.STATE)} · ${fmt(p.CUSTOMERS)} customers · ${esc(rtoOf(p))} · ${esc(ownerOf(p))}`;

  let h = '';
  const pr = presenceOf(p);
  if(pr){
    const chip = (label, v, t) => {
      const tt = v==='Yes' && t ? ` title="Source: ${esc(t)}"` : '';
      const mark = v==='Yes' && t ? ` <small style="opacity:.85">(${esc(t[0])})</small>` : '';
      return `<span${tt} style="background:${PRES_COLORS[v]||'#eee'};color:${v==='Unknown'||v==='NotScanned'?'#333':'#fff'}">${label}: ${esc(v)}${mark}</span>`;
    };
    const oof = !IN_FOOTPRINT(pr.rto);
    h += `<div class="sec"><h3>Has program?</h3><div class="chips">
      ${oof?`<span style="background:#8c8c8c;color:#fff">Not in MISO/PJM — ${esc(pr.rto)}</span>`:''}
      ${chip('Res · price signal', pr.rh, pr.rht)}${chip('Res · dispatch', pr.rd, pr.rdt)}
      ${chip('C&I · price signal', pr.ch, pr.cht)}${chip('C&I · dispatch', pr.cd, pr.cdt)}
      </div><div style="font-size:10.5px;color:#777;margin-top:2px">(P) primary source · (S) secondary · (U) unverified — hover a chip</div></div>`;
  }
  if(!u){
    h += `<div class="warn">No program data matched to this utility. Either we have not researched
      it, or the name did not match our crosswalk. HIFLD name normalizes to
      <code>${esc(norm(p.NAME))}</code>.</div>`;
  } else {
    const byCat = {};
    u.programs.forEach(x=>(byCat[x.cat] ||= []).push(x));
    const cats = CAT_ORDER.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CAT_ORDER.includes(c)));
    const nStor = u.programs.filter(x=>x.stor==='Yes'||x.stor==='Yes-restricted').length;
    h += `<div class="sec"><h3>Summary</h3><div class="chips">
      <span>${u.programs.length} programs</span><span>${nStor} storage-eligible</span>
      <span>matched as: ${esc(u.name)}</span>${u.scope!=='utility'?`<span>scope: ${esc(u.scope)}</span>`:''}
      </div></div>`;
    h += `<div class="sec"><h3>Programs &amp; rates</h3>${tierKey()}`;
    cats.forEach(c=>{ h += byCat[c].map(programHTML).join(''); });
    h += `</div>`;
  }

  h += interconnectionHTML(p, u);

  h += `<div class="sec"><h3>Full bill structure</h3>
    <div class="placeholder">Phase 3 — not yet built. Will carry: fixed/customer charge, energy
    charges by season and period, demand charges and ratchets, all riders (fuel/PCA, capacity,
    transmission, EE surcharge), minimum bills, taxes and franchise fees, plus 5–10 yr
    escalation history.</div></div>`;

  h += `<div class="sec"><h3>Aggregators / CSPs</h3>
    <div class="placeholder">Phase 4 — not yet built. Most residential BTM assets reach DR and
    ancillary markets through a third-party aggregator rather than a utility tariff, so an empty
    Programs list above does not mean zero revenue opportunity.</div></div>`;

  h += `<div class="sec"><h3>Hosting capacity</h3>
    <div class="placeholder">Phase 6 — not yet built. Note that published hosting capacity is
    almost always <i>generation</i> hosting capacity; load headroom for electrification is rarely
    published.</div></div>`;

  const mkt = DATA.market.filter(m=>m.rto.startsWith(rtoOf(p).split('/')[0]));
  if(mkt.length){
    h += `<div class="sec"><h3>Wholesale market products (${esc(rtoOf(p))})</h3>
      ${mkt.map(programHTML).join('')}</div>`;
  }

  h += `<div class="sec"><h3>Source tiers</h3>${tierKeyHTML()}
    <div class="placeholder" style="margin-top:6px">Tiers are derived from the linked URL's domain
    (utility / regulator / RTO / statute = Primary) plus the researcher's note, and err toward the
    lower tier. No row has been independently audited. Re-check the source before quoting anything
    to a customer.</div></div>`;

  document.getElementById('dBody').innerHTML = h;
  drawer.classList.add('open');
}
document.getElementById('closeDrawer').onclick = ()=>drawer.classList.remove('open');

function popup(p){
  const u = progsFor(p);
  return `<b>${esc(p.NAME||'(unnamed)')}</b><br>EIA ID <code>${esc(p.ID)}</code> · ${esc(p.STATE)}<br>
    ${esc(rtoOf(p))} · ${esc(ownerOf(p))}<br>
    <b>${u?u.programs.length:0}</b> programs on file`;
}

function renderLegend(){
  const seg = {all:'all customers', res:'residential', ci:'C&I'}[currentSeg];
  let title, m;
  if(currentView==='util'){ title='Utility service territories'; m={'Each color is one utility. Click for details.':UTIL_PALETTE[0]}; }
  else if(currentView==='rto'){ title='RTO / ISO or balancing authority'; m=RTO_COLORS; }
  else if(currentView==='type'){
    title=`${PROGRAM_TYPES[currentType].label} (${seg})`;
    m={'2 or more':V.c3,'1':V.c2,'Has a related program, type not itemized':V.related,
       'None found':V.none,'Not researched':V.unknown,'Outside researched markets':V.outside};
  } else {
    title=`Programs on file (${seg})`;
    m={'10+':V.c4,'6–9':V.c3,'3–5':V.c2,'1–2':V.c1,'Has programs, not itemized':V.related,
       'None found':V.none,'Not researched':V.unknown,'Outside researched markets':V.outside};
  }
  legendEl.innerHTML = `<div class="lgtitle">${esc(title)}</div>` +
    Object.entries(m).map(([k,c])=>`<div><i style="background:${c}"></i>${esc(k)}</div>`).join('');
}

/* ---- load ---- */
const WHERE = "(STATE IN (" + STATES.map(s=>`'${s}'`).join(',') + ") AND COUNTRY='USA')" +
  (EXTRA_IDS.length ? " OR ID IN (" + EXTRA_IDS.map(i=>`'${i}'`).join(',') + ")" : "");
const PAGE = 2000;
async function fetchPage(offset){
  const p = new URLSearchParams({where:WHERE, outFields:OUT_FIELDS, returnGeometry:'true',
    outSR:'4326', maxAllowableOffset:'0.005', geometryPrecision:'4',
    resultOffset:offset, resultRecordCount:PAGE, f:'geojson'});
  const r = await fetch(`${SVC}?${p}`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const gj = await r.json();
  if(gj.error) throw new Error(JSON.stringify(gj.error));
  return gj;
}

async function load(){
  try{
    statusEl.textContent = 'Loading program data…';
    try{
      const pr = await fetch('data/programs.json',{cache:'no-cache'});
      if(pr.ok) DATA = await pr.json();
      else statusEl.textContent = 'programs.json not found — map will render without program data.';
    }catch(e){ console.warn('programs.json load failed', e); }
    try{
      const pp = await fetch('data/presence.json',{cache:'no-cache'});
      if(pp.ok) PRES = await pp.json();
    }catch(e){ console.warn('presence.json load failed', e); }

    let all=[], offset=0, more=true;
    while(more){
      statusEl.textContent = `Loading territories… (${offset})`;
      const gj = await fetchPage(offset);
      const feats = gj.features||[];
      all = all.concat(feats);
      more = !!gj.exceededTransferLimit && feats.length===PAGE;
      offset += feats.length;
    }
    allFeatures = all;

    layer = L.geoJSON({type:'FeatureCollection',features:all}, {style:styleFn,
      /* Clicks resolve through findContaining(), same as address lookup. Leaflet's own click hits
         whichever polygon is drawn on top, and some HIFLD boundaries are wrong: e.g. Fishers Island
         Utility (0 programs) is drawn over most of Long Island, hiding LIPA. findContaining collects
         every polygon under the point and prefers the one we have data for. */
      onEachFeature:(f,l)=>{ l.on('click',e=>{
        const hits=findContaining(e.latlng.lat,e.latlng.lng);
        const best=hits[0]||l;
        if(highlighted) highlighted.setStyle(styleFn(highlighted.feature));
        highlighted=best; best.setStyle(styleFnHL(best.feature));
        openDrawer(best.feature.properties);
        const others=hits.slice(1).map(h=>h.feature.properties.NAME);
        if(others.length){
          document.getElementById('dBody').insertAdjacentHTML('afterbegin',
            `<div class="warn">Also mapped at this point: ${others.map(esc).join('; ')}. Overlapping boundaries are usually a data artifact; showing the utility we have program data for.</div>`);
        }
      }); }}).addTo(map);

    // match stats
    const seen = new Set();
    all.forEach(f=>{ const k=norm(f.properties.NAME); if(DATA.utilities[k]) seen.add(k); });
    matchStats.matched = seen.size;
    matchStats.total = Object.values(DATA.utilities).filter(u=>u.scope==='utility').length;
    matchStats.unmatchedPayload = Object.entries(DATA.utilities)
      .filter(([k,u])=>u.scope==='utility' && !seen.has(k)).map(([k,u])=>({key:k,name:u.name,state:u.state}));

    const counts={MISO:0,PJM:0,OTHER:0};
    all.forEach(f=>{ const r=rtoOf(f.properties); counts[r]=(counts[r]||0)+1; });
    const notYet = all.length - (counts.MISO||0) - (counts.PJM||0) - (counts['MISO/PJM']||0) - (counts.NYISO||0);
    statusEl.textContent =
      `${all.length} territories.\nMISO ${counts.MISO||0} · PJM ${counts.PJM||0} · NYISO ${counts.NYISO||0} · other markets ${notYet}\n`+
      `Programs matched to ${matchStats.matched}/${matchStats.total} researched utilities.\n`+
      `${matchStats.unmatchedPayload.length} unmatched (see console).`;
    if(matchStats.unmatchedPayload.length){
      console.warn('Unmatched payload utilities — add to data/crosswalk/aliases.csv:');
      console.table(matchStats.unmatchedPayload);
    }
    if(all.length) map.fitBounds(layer.getBounds(),{padding:[20,20]});
    renderLegend();
  }catch(e){ statusEl.textContent='Load failed: '+e.message; }
}

/* ---- crosswalk export: the browser has network access the build env does not ---- */
document.getElementById('exportBtn').onclick = (ev)=>{ if(ev) ev.preventDefault();
  const rows = [['eia_id','hifld_name','state','customers','matched_utility_name','n_programs','match']];
  allFeatures.forEach(f=>{
    const p=f.properties, u=DATA.utilities[norm(p.NAME)];
    if(u) rows.push([p.ID,p.NAME,p.STATE,p.CUSTOMERS??'',u.name,u.programs.length,'matched']);
  });
  matchStats.unmatchedPayload.forEach(u=>rows.push(['','','' ,'',u.name,'','UNMATCHED-no-polygon']));
  const csv = rows.map(r=>r.map(v=>{
    const s=String(v??''); return /[",\n]/.test(s)?'"'+s.split('"').join('""')+'"':s;}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='utility_eia_crosswalk.csv'; a.click();
};

/* ---- location lookup ---- */
async function geocode(query){
  const ll = query.match(/^\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*$/);
  if(ll) return {lat:parseFloat(ll[1]), lon:parseFloat(ll[2]), display:'(direct coordinates)'};
  const isZip = /^\d{5}$/.test(query);
  // Nominatim usage policy: max 1 req/sec, identify the app. Browsers forbid setting
  // User-Agent, so we rely on Referer. Swap to a keyed geocoder before any real volume.
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(isZip?query+', USA':query)}&format=json&limit=1&countrycodes=us`;
  const r = await fetch(url,{headers:{'Accept-Language':'en'}});
  if(!r.ok) throw new Error(`geocoder HTTP ${r.status}`);
  const data = await r.json();
  if(!data.length) throw new Error('Address not found');
  return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon), display:data[0].display_name};
}

function pip(x,y,geom){
  const polys = geom.type==='MultiPolygon' ? geom.coordinates.map(p=>p[0]) : [geom.coordinates[0]];
  for(const ring of polys){
    let inside=false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
      if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
    }
    if(inside) return true;
  }
  return false;
}

/* A point commonly falls in several overlapping HIFLD polygons. Collect them all and
   prefer the one we actually have program data for. */
function findContaining(lat,lon){
  if(!layer) return [];
  const pt=L.latLng(lat,lon), hits=[];
  layer.eachLayer(l=>{
    if(!l.getBounds().contains(pt)) return;
    if(pip(lon,lat,l.feature.geometry)) hits.push(l);
  });
  hits.sort((a,b)=>{
    const ua=progsFor(a.feature.properties), ub=progsFor(b.feature.properties);
    return (ub?ub.programs.length:0)-(ua?ua.programs.length:0);
  });
  return hits;
}

document.getElementById('locBtn').addEventListener('click', async ()=>{
  const q=document.getElementById('locInput').value.trim();
  if(!q){ locResult.textContent='Enter an address, zip, or lat,lon'; return; }
  locResult.textContent='Looking up…';
  try{
    const {lat,lon,display}=await geocode(q);
    if(marker) map.removeLayer(marker);
    marker=L.marker([lat,lon]).addTo(map);
    map.setView([lat,lon],10);
    if(highlighted){ highlighted.setStyle(styleFn(highlighted.feature)); highlighted=null; }

    const hits=findContaining(lat,lon);
    if(hits.length){
      highlighted=hits[0];
      highlighted.setStyle(styleFnHL(highlighted.feature));
      openDrawer(highlighted.feature.properties);
      const others = hits.slice(1).map(h=>h.feature.properties.NAME).join('\n  ');
      locResult.textContent = `${display}\n→ ${hits[0].feature.properties.NAME}` +
        (others?`\nAlso overlapping:\n  ${others}`:'');
    } else {
      locResult.textContent=`Geocoded: ${display}\n(${lat.toFixed(4)}, ${lon.toFixed(4)})\nNo territory polygon found.`;
    }
  }catch(e){ locResult.textContent='Error: '+e.message; }
});

document.getElementById('locInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('locBtn').click(); });

function restyle(){
  const po=document.getElementById('progOpts');
  const prog = currentView==='type'||currentView==='count';
  po.setAttribute('aria-disabled', prog?'false':'true');
  po.classList.toggle('count-mode', currentView==='count');
  if(layer) layer.setStyle(styleFn);
  if(highlighted) highlighted.setStyle(styleFnHL(highlighted.feature));
  renderLegend();
}
document.querySelectorAll('input[name=view]').forEach(el=>el.addEventListener('change',e=>{ currentView=e.target.value; restyle(); }));
document.querySelectorAll('input[name=seg]').forEach(el=>el.addEventListener('change',e=>{ currentSeg=e.target.value; restyle(); }));
document.getElementById('typeSel').addEventListener('change',e=>{ currentType=e.target.value; restyle(); });

/* ---- collapsible panel + legend ---- */
(function(){
  const isMobile = window.matchMedia('(max-width:600px)').matches;
  const store = k => { try{ return localStorage.getItem('collapse:'+k); }catch(e){ return null; } };
  const save  = (k,v) => { try{ localStorage.setItem('collapse:'+k, v?'1':'0'); }catch(e){} };
  document.querySelectorAll('.boxhd[data-toggle]').forEach(hd=>{
    const id = hd.dataset.toggle, box = document.getElementById(id), btn = hd.querySelector('.tgl');
    const apply = c => { box.classList.toggle('collapsed', c); btn.textContent = c ? '▸' : '▾';
      btn.setAttribute('aria-expanded', String(!c)); };
    const saved = store(id);
    apply(saved===null ? isMobile : saved==='1');
    hd.addEventListener('click', ()=>{ const c = !box.classList.contains('collapsed'); apply(c); save(id,c); });
  });
})();

renderLegend();
load();
</script>
