<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTM Utility Territory Map — MISO + PJM (Phase 1 prototype)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:13px/1.4 system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;
    padding:10px 12px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.3);max-width:240px}
  .panel h1{font-size:13px;margin:0 0 6px}
  .panel label{display:block;margin:2px 0;cursor:pointer}
  #status{font-size:11px;color:#555;margin-top:8px;white-space:pre-line}
  .legend{position:absolute;bottom:18px;right:10px;z-index:1000;background:#fff;
    padding:8px 10px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.3);font-size:12px}
  .legend i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border:1px solid #999}
  .leaflet-popup-content{font-size:12px}
  hr.div{margin:8px 0;border:none;border-top:1px solid #ddd}
  #locInput{width:100%;box-sizing:border-box;margin:4px 0;padding:4px;
    font-size:12px;border:1px solid #ccc;border-radius:3px}
  #locBtn{width:100%;padding:4px;font-size:12px;cursor:pointer;margin-bottom:2px}
  #locResult{font-size:11px;color:#333;margin-top:4px;white-space:pre-line}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Utility territories — MISO + PJM</h1>
  <strong>Color by:</strong>
  <label><input type="radio" name="view" value="rto" checked> RTO (heuristic)</label>
  <label><input type="radio" name="view" value="owner"> Ownership type</label>
  <label><input type="radio" name="view" value="dr"> DR program status (stub)</label>
  <label><input type="radio" name="view" value="none"> Off</label>
  <div id="status">Loading…</div>
  <hr class="div">
  <strong>Find utility at location:</strong>
  <input id="locInput" type="text" placeholder="Address, zip, or lat,lon">
  <button id="locBtn">Look up</button>
  <div id="locResult"></div>
</div>
<div class="legend" id="legend"></div>

<script>
const SVC = "https://services3.arcgis.com/OYP7N6mAJJCyH6hd/arcgis/rest/services/Electric_Retail_Service_Territories_HIFLD/FeatureServer/0/query";

const STATES = ['MN','WI','IA','IL','IN','MI','MO','OH','PA','NJ','MD','DE',
                'VA','WV','KY','DC','AR','LA','MS','ND','SD'];
const OUT_FIELDS = "ID,NAME,TYPE,STATE,CUSTOMERS,CNTRL_AREA,PLAN_AREA";

/* Phase-2 seam — populate with real EIA-ID-keyed DR program data */
const DR_TABLE = {};

/* ---- styling ---- */
const RTO_COLORS  = {MISO:'#1b9e77', PJM:'#3a6fb0', OTHER:'#bdbdbd'};
const OWNER_COLORS = {
  'INVESTOR OWNED':'#e6550d','COOPERATIVE':'#31a354','MUNICIPAL':'#756bb1',
  'POLITICAL SUBDIVISION':'#9ecae1','STATE':'#fec44f','FEDERAL':'#636363',
  'RETAIL POWER MARKETER':'#e7298a'
};
const DR_COLORS = {active:'#1a9850', partial:'#fee08b', none:'#d73027', unknown:'#cccccc'};

function classifyRTO(p){
  const s = ((p.CNTRL_AREA||'')+' '+(p.PLAN_AREA||'')).toUpperCase();
  if (s.includes('MIDCONTINENT') || /\bMISO\b/.test(s)) return 'MISO';
  if (s.includes('PJM')) return 'PJM';
  return 'OTHER';
}
function drStatus(p){ const r=DR_TABLE[p.ID]; return r&&r.status?r.status:'unknown'; }
function ownerKey(p){ return (p.TYPE||'').toUpperCase().trim(); }

let currentView = 'rto';
function colorFor(p){
  if (currentView==='none') return 'transparent';
  if (currentView==='rto')   return RTO_COLORS[classifyRTO(p)]  || '#bdbdbd';
  if (currentView==='owner') return OWNER_COLORS[ownerKey(p)]   || '#dddddd';
  return DR_COLORS[drStatus(p)] || '#cccccc';
}
const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
const BORDER = darkMode ? '#fff' : '#333';
function styleFn(f){ return {color:currentView==='none'?'transparent':BORDER,weight:currentView==='none'?0:0.8,fillColor:colorFor(f.properties),fillOpacity:currentView==='none'?0:0.15}; }
function styleFnHL(f){ return {color:'#f00',weight:2,fillColor:colorFor(f.properties),fillOpacity:0.8}; }

/* ---- map ---- */
const map = L.map('map').setView([40.5,-85],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:19}).addTo(map);

let layer = null, marker = null, highlighted = null;
const statusEl  = document.getElementById('status');
const legendEl  = document.getElementById('legend');
const locResult = document.getElementById('locResult');

function popup(p){
  const fmt = n => (n==null?'—':Number(n).toLocaleString());
  return `<b>${p.NAME||'(unnamed)'}</b><br>
EIA ID: <code>${p.ID||'—'}</code><br>
Type: ${p.TYPE||'—'}<br>
State: ${p.STATE||'—'} &nbsp; Customers: ${fmt(p.CUSTOMERS)}<br>
RTO (heuristic): <b>${classifyRTO(p)}</b><br>
Ctrl area: ${p.CNTRL_AREA||'—'}<br>
Plan area: ${p.PLAN_AREA||'—'}<br>
DR status: ${drStatus(p)}`;
}

function renderLegend(){
  const m = currentView==='rto'?RTO_COLORS:currentView==='owner'?OWNER_COLORS:DR_COLORS;
  legendEl.innerHTML = Object.entries(m)
    .map(([k,c])=>`<div><i style="background:${c}"></i>${k}</div>`).join('');
}

/* ---- load with pagination ---- */
const WHERE = "STATE IN (" + STATES.map(s=>`'${s}'`).join(',') + ") AND COUNTRY='USA'";
const PAGE  = 2000;

async function fetchPage(offset){
  const p = new URLSearchParams({
    where:WHERE, outFields:OUT_FIELDS, returnGeometry:'true', outSR:'4326',
    maxAllowableOffset:'0.005', geometryPrecision:'4',
    resultOffset:offset, resultRecordCount:PAGE, f:'geojson'
  });
  const r = await fetch(`${SVC}?${p}`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const gj = await r.json();
  if(gj.error) throw new Error(JSON.stringify(gj.error));
  return gj;
}

async function load(){
  try{
    let all=[], offset=0, more=true;
    while(more){
      statusEl.textContent = `Loading… (${offset} fetched)`;
      const gj = await fetchPage(offset);
      const feats = gj.features||[];
      all = all.concat(feats);
      more = !!gj.exceededTransferLimit && feats.length===PAGE;
      offset += feats.length;
    }
    const fc = {type:'FeatureCollection', features:all};
    layer = L.geoJSON(fc, {style:styleFn,
      onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))}).addTo(map);
    const counts={MISO:0,PJM:0,OTHER:0};
    all.forEach(f=>counts[classifyRTO(f.properties)]++);
    statusEl.textContent =
      `${all.length} territories loaded.\nMISO ${counts.MISO} · PJM ${counts.PJM} · OTHER ${counts.OTHER}\n(${counts.OTHER} need EIA-ID→RTO join)`;
    if(all.length) map.fitBounds(layer.getBounds(),{padding:[20,20]});
  }catch(e){ statusEl.textContent='Load failed: '+e.message; }
}

/* ---- location lookup ---- */
async function geocode(query){
  // detect "lat,lon" pattern
  const ll = query.match(/^\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*$/);
  if(ll) return {lat:parseFloat(ll[1]), lon:parseFloat(ll[2]), display:'(direct coordinates)'};
  const isZip = /^\d{5}$/.test(query);
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(isZip ? query+', USA' : query)}&format=json&limit=1&countrycodes=us`;
  const r = await fetch(url, {headers:{'Accept-Language':'en'}});
  const data = await r.json();
  if(!data.length) throw new Error('Address not found');
  return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon), display:data[0].display_name};
}

function findContainingPolygon(lat, lon){
  if(!layer) return null;
  const pt = L.latLng(lat, lon);
  let found = null;
  layer.eachLayer(l => {
    if(found) return;
    // rough bounds check first for speed
    if(!l.getBounds().contains(pt)) return;
    // point-in-polygon via leaflet's contains on each ring
    const geom = l.feature.geometry;
    if(pip(lon, lat, geom)) found = l;
  });
  return found;
}

/* Ray-casting point-in-polygon for GeoJSON geometry (Polygon + MultiPolygon) */
function pip(x, y, geom){
  const polys = geom.type==='MultiPolygon'
    ? geom.coordinates.map(p=>p[0])
    : [geom.coordinates[0]];
  for(const ring of polys){
    let inside=false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
      if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
    }
    if(inside) return true;
  }
  return false;
}

document.getElementById('locBtn').addEventListener('click', async ()=>{
  const q = document.getElementById('locInput').value.trim();
  if(!q){ locResult.textContent='Enter an address, zip, or lat,lon'; return; }
  locResult.textContent = 'Looking up…';
  try{
    const {lat,lon,display} = await geocode(q);

    // drop/move marker
    if(marker) map.removeLayer(marker);
    marker = L.marker([lat,lon]).addTo(map);
    map.setView([lat,lon], 10);

    // unhighlight previous
    if(highlighted){ highlighted.setStyle(styleFn(highlighted.feature)); highlighted=null; }

    const found = findContainingPolygon(lat, lon);
    if(found){
      highlighted = found;
      found.setStyle(styleFnHL(found.feature));
      found.openPopup();
      const p = found.feature.properties;
      const fmt = n => (n==null?'—':Number(n).toLocaleString());
      locResult.textContent =
        `${p.NAME||'(unnamed)'}\nEIA ID: ${p.ID||'—'}\nType: ${p.TYPE||'—'}\n`+
        `Customers: ${fmt(p.CUSTOMERS)}\nRTO: ${classifyRTO(p)}\n`+
        `Ctrl area: ${p.CNTRL_AREA||'—'}`;
    } else {
      locResult.textContent = `Geocoded: ${display}\n(lat ${lat.toFixed(4)}, lon ${lon.toFixed(4)})\nNo territory polygon found — point may be outside loaded states or in a gap.`;
    }
  }catch(e){ locResult.textContent='Error: '+e.message; }
});

document.getElementById('locInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('locBtn').click();
});

document.querySelectorAll('input[name=view]').forEach(el=>
  el.addEventListener('change',e=>{
    currentView=e.target.value;
    if(layer) layer.setStyle(styleFn);
    if(highlighted) highlighted.setStyle(styleFnHL(highlighted.feature));
    renderLegend();
  }));

renderLegend();
load();
</script>
</body>
</html>
